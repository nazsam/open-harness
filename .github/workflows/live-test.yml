name: Live test

# Runs real calls against a model provider. Start it from the Actions tab.
# Needs the repository secret ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:
    inputs:
      model:
        description: "provider:model to test"
        default: "anthropic:claude-sonnet-5"

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENHARNESS_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e python
      - name: Python live test
        run: python scripts/live_smoke.py
      - name: TypeScript live test
        run: |
          cd typescript && npm install && npm run build && cd ..
          node scripts/live-smoke.mjs
