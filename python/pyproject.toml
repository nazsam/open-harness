[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "open-harness"
version = "0.1.0"
description = "A self-hosted SDK for building AI agents: tools, structured output, memory, sessions, streaming, guardrails, tracing, MCP and multi-agent, across OpenAI, Anthropic, Gemini and OpenAI-compatible models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sam Naz" }]
keywords = ["ai", "agents", "llm", "sdk", "mcp", "openai", "anthropic", "gemini", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pydantic>=2"]

[project.scripts]
openharness = "openharness.cli:main"

[project.urls]
Homepage = "https://github.com/nazsam/open-harness"
Documentation = "https://nazsam.github.io/open-harness/"
Issues = "https://github.com/nazsam/open-harness/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openharness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "UP007", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
